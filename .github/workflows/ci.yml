name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:types
      - run: npm run build
      # Visual tests are not run here: their baselines are rendered on macOS
      # and Linux rasterises text differently. Run `npm run test:visual` locally.
