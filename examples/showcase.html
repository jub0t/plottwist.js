<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>plottwist showcase</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Renders the README image. Charts sit at the exact positions they take in
         the composite; scripts/build-showcase.js calls window.compose(). */
      body { margin: 0; background: #07070b; }
      .tile { position: absolute; }
    </style>
  </head>
  <body>
    <script type="module">
      import { registerTheme } from '../src/index.js';
      import { demos, previewTheme } from './demos.js';

      // The README's transparent look (see previewTheme in demos.js).
      registerTheme('preview', previewTheme);
      const INK = previewTheme.text;

      // Per-chart tweaks for the preview.
      const previewOptions = {
        map: { arcs: null },
        regions: { arcs: null, borderColor: '#ffffff' },
        // Nearly face-on so the year runs across the full width.
        calendar: { camera: { yaw: 0.06, pitch: 0.95 } },
        galton: { autoplay: false },
      };

      // Timeline position to show, when not the last frame. Tanks: September,
      // when two reservoirs are below their safe minimum (amber) and four aren't.
      // Balance: Q3, when actual spend runs visibly over budget.
      const showAt = { tanks: 3, balance: 2 };

      const W = 1200;
      const PAD = 8;
      const LABEL = 22;
      const GAP = 10;
      const inner = W - PAD * 2;
      const half = (inner - GAP) / 2;
      const third = (inner - GAP * 2) / 3;

      // [demo id, x, y, w, h] of each chart, below its title. Packed tight:
      // maps side by side, three grid charts in a row, the calendar as a strip.
      const layout = [];
      let y = PAD;
      layout.push(['map', PAD, y + LABEL, half, 340], ['regions', PAD + half + GAP, y + LABEL, half, 340]);
      y += LABEL + 340 + GAP;
      layout.push(
        ['bars', PAD, y + LABEL, third, 330],
        ['stack', PAD + third + GAP, y + LABEL, third, 330],
        ['ribbon', PAD + (third + GAP) * 2, y + LABEL, third, 330],
      );
      y += LABEL + 330 + GAP;
      layout.push(['race', PAD, y + LABEL, half, 300], ['calendar', PAD + half + GAP, y + LABEL, half, 300]);
      y += LABEL + 300 + GAP;
      // The surface twice, in two of its styles.
      layout.push(
        ['surface', PAD, y + LABEL, half, 360, { title: 'Terrain surface · voxel', options: { preset: 'voxel' } }],
        ['surface', PAD + half + GAP, y + LABEL, half, 360, { title: 'Terrain surface · wireframe', options: { preset: 'wireframe' } }],
      );
      y += LABEL + 360 + GAP;
      layout.push(
        ['helix', PAD, y + LABEL, third, 340],
        ['galton', PAD + third + GAP, y + LABEL, third, 340],
        ['waffle', PAD + (third + GAP) * 2, y + LABEL, third, 340],
      );
      y += LABEL + 340 + GAP;
      const twoThirds = third * 2 + GAP;
      layout.push(['tanks', PAD, y + LABEL, twoThirds, 300], ['balance', PAD + twoThirds + GAP, y + LABEL, third, 300]);
      y += LABEL + 300 + GAP;
      layout.push(['iceberg', PAD, y + LABEL, inner, 440]);
      y += LABEL + 440;
      const H = y + PAD;

      const charts = layout.map(([id, x, top, w, h, extra]) => {
        const el = Object.assign(document.createElement('div'), { className: 'tile' });
        Object.assign(el.style, { left: `${x}px`, top: `${top}px`, width: `${w}px`, height: `${h}px` });
        document.body.append(el);
        return demos[id].create(el, { theme: 'preview', ...previewOptions[id], ...extra?.options }).chart;
      });

      // Advance every chart to the end of its timeline with all entrance
      // animations finished, using synthetic timestamps (headless browsers
      // barely run requestAnimationFrame).
      function settle() {
        let t = performance.now();
        layout.forEach(([id], i) => {
          const c = charts[i];
          c.visible = true;
          c.seek(showAt[id] ?? c.timeline.length - 1);
        });
        for (let i = 0; i < 700; i++) {
          t += 16;
          for (const c of charts) {
            cancelAnimationFrame(c._raf);
            c._raf = null;
            c._dirty = true;
            c._frame(t);
          }
        }
      }

      // Composite every chart onto one transparent canvas, each under its title.
      window.compose = async () => {
        await document.fonts.load('600 14px Inter');
        await document.fonts.load('400 12px "JetBrains Mono"');
        await document.fonts.ready;
        settle();

        const dpr = window.devicePixelRatio || 1;
        const out = document.createElement('canvas');
        out.width = W * dpr;
        out.height = H * dpr;
        const ctx = out.getContext('2d');
        ctx.scale(dpr, dpr);

        layout.forEach(([id, x, top, w, h, extra], i) => {
          const chart = charts[i];
          // A mid grey that reads on both light and dark page backgrounds.
          ctx.textBaseline = 'middle';
          ctx.textAlign = 'left';
          ctx.font = '600 14px Inter, sans-serif';
          ctx.fillStyle = INK;
          ctx.fillText(extra?.title ?? demos[id].title, x + 4, top - LABEL / 2);
          ctx.drawImage(chart.renderer.canvas, x, top, w, h);
          if (chart.overlay) ctx.drawImage(chart.overlay.canvas, x, top, w, h);
        });
        return out.toDataURL('image/png');
      };
      window.showcaseSize = { width: W, height: H };
    </script>
  </body>
</html>
