<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>plottwist showcase</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Renders the README image. Charts sit at the exact positions they take in
         the composite; scripts/build-showcase.js calls window.compose(). */
      body { margin: 0; background: #07070b; }
      .tile { position: absolute; }
    </style>
  </head>
  <body>
    <script type="module">
      import { demos } from './demos.js';

      const W = 1200;
      const PAD = 40;
      const LABEL = 30;
      const GAP = 28;
      const inner = W - PAD * 2;
      const half = (inner - GAP) / 2;

      // [demo id, x, y, w, h] of each chart, below its label.
      const layout = [];
      let y = PAD;
      layout.push(['map', PAD, y + LABEL, inner, 560]);
      y += LABEL + 560 + GAP;
      layout.push(['bars', PAD, y + LABEL, half, 380], ['stack', PAD + half + GAP, y + LABEL, half, 380]);
      y += LABEL + 380 + GAP;
      layout.push(['calendar', PAD, y + LABEL, half, 380], ['ribbon', PAD + half + GAP, y + LABEL, half, 380]);
      y += LABEL + 380;
      const H = y + PAD;

      const charts = layout.map(([id, x, top, w, h]) => {
        const el = Object.assign(document.createElement('div'), { className: 'tile' });
        Object.assign(el.style, { left: `${x}px`, top: `${top}px`, width: `${w}px`, height: `${h}px` });
        document.body.append(el);
        return demos[id].create(el, { theme: 'midnight' }).chart;
      });

      // Advance every chart to the end of its timeline with all entrance
      // animations finished, using synthetic timestamps (headless browsers
      // barely run requestAnimationFrame).
      function settle() {
        let t = performance.now();
        for (const c of charts) {
          c.visible = true;
          if (c.frames.length > 1) c.seek(c.frames.length - 1);
        }
        for (let i = 0; i < 260; i++) {
          t += 16;
          for (const c of charts) {
            cancelAnimationFrame(c._raf);
            c._raf = null;
            c._dirty = true;
            c._frame(t);
          }
        }
      }

      // variant 'transparent': charts on nothing (for dark page backgrounds).
      // variant 'card': the same on a rounded midnight card (for light pages).
      window.compose = async (variant) => {
        await document.fonts.load('600 14px Inter');
        await document.fonts.load('400 12px "JetBrains Mono"');
        await document.fonts.ready;
        settle();

        const dpr = window.devicePixelRatio || 1;
        const out = document.createElement('canvas');
        out.width = W * dpr;
        out.height = H * dpr;
        const ctx = out.getContext('2d');
        ctx.scale(dpr, dpr);

        if (variant === 'card') {
          ctx.beginPath();
          ctx.roundRect(0.5, 0.5, W - 1, H - 1, 28);
          ctx.fillStyle = '#07070b';
          ctx.fill();
          ctx.save();
          ctx.clip();
          for (const [x, y, r] of [[W * 0.15, -60, 700], [W * 0.95, 120, 520]]) {
            const g = ctx.createRadialGradient(x, y, 0, x, y, r);
            g.addColorStop(0, 'rgba(110, 70, 255, 0.16)');
            g.addColorStop(1, 'rgba(110, 70, 255, 0)');
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, W, H);
          }
          ctx.restore();
          ctx.strokeStyle = '#262640';
          ctx.lineWidth = 1;
          ctx.stroke();
        }

        layout.forEach(([id, x, top, w, h], i) => {
          const chart = charts[i];
          // Label: chart name in ink, class name in mono.
          ctx.textBaseline = 'middle';
          ctx.textAlign = 'left';
          ctx.font = '600 15px Inter, sans-serif';
          ctx.fillStyle = '#f4f3ff';
          const ly = top - LABEL / 2 - 2;
          ctx.fillText(demos[id].title, x + 4, ly);
          const tw = ctx.measureText(demos[id].title).width;
          ctx.font = '400 12px "JetBrains Mono", monospace';
          ctx.fillStyle = '#9897b8';
          ctx.fillText(demos[id].type + (chart.frameLabel != null ? ` · ${chart.frameLabel}` : ''), x + tw + 14, ly + 1);

          ctx.drawImage(chart.renderer.canvas, x, top, w, h);
          if (chart.overlay) ctx.drawImage(chart.overlay.canvas, x, top, w, h);
        });
        return out.toDataURL('image/png');
      };
      window.showcaseSize = { width: W, height: H };
    </script>
  </body>
</html>
